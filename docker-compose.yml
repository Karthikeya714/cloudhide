services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - backend-db:/app/data
    environment:
      DATABASE_URL: sqlite:////app/data/cloudhide.db
      STORAGE_ROOT: /app/storage
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      STORAGE_PROVIDER: local
    depends_on:
      - minio

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data

volumes:
  backend-db:
  minio-data:
